<!-- Google Consent Mode v2 + Google Tag Manager.

     SINGLE SOURCE OF TRUTH. This file is injected into every HTML surface we
     ship, so the tag cannot drift between them again:
       - the SPA shell, by the `inject-analytics-tag` plugin in vite.config.js,
         which replaces the ANALYTICS_TAG comment placeholder in
         client/index.html
       - the static blog posts, by scripts/build-blog.js, which replaces the
         analytics placeholder in content/blog/_template.html
       - the static blog index, by scripts/build-blog.js (inline template)
     Until August 2026 the blog carried no tag at all: every /blog/ pageview
     — the entire SEO surface — was invisible to analytics. Hence one file.

     Do not write a nested comment terminator or a template placeholder inside
     this comment: the first would close it early and leak the rest as text, the
     second would survive substitution and look like an unreplaced placeholder.

     ORDER MATTERS. The consent defaults must execute *before* gtm.js so GTM
     holds its tags instead of firing them with storage granted. Consent Mode v2
     is required for EEA traffic. A returning visitor's stored choice is
     replayed here synchronously, so their very first hit is already correct
     rather than starting denied and being upgraded a moment later. -->
<script>
  window.dataLayer = window.dataLayer || [];
  // The gtag shim must exist before GTM loads. Consent commands only work when
  // pushed as an `arguments` object — dataLayer.push(['consent', ...]) with a
  // plain array is silently ignored by GTM.
  function gtag() { dataLayer.push(arguments); }
  window.gtag = gtag;

  gtag('consent', 'default', {
    ad_storage: 'denied',
    analytics_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    functionality_storage: 'granted',
    security_storage: 'granted',
    wait_for_update: 500
  });

  (function () {
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem('channelad-cookie-consent') || 'null'); } catch (e) {}
    if (!stored) return;
    window.__channeladConsent = stored;
    gtag('consent', 'update', {
      ad_storage: stored.marketing ? 'granted' : 'denied',
      analytics_storage: stored.analytics ? 'granted' : 'denied',
      ad_user_data: stored.marketing ? 'granted' : 'denied',
      ad_personalization: stored.marketing ? 'granted' : 'denied'
    });
  })();

  // Deferred past load to keep GTM off the critical path (TBT).
  window.addEventListener('load', function () {
    setTimeout(function () {
      var j = document.createElement('script');
      j.async = true;
      j.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-5D2RGMVJ';
      document.head.appendChild(j);
    }, 1500);
  });

  // Ahrefs Web Analytics is cookieless, but the cookie banner offers a switch
  // for it, so it must not load before analytics consent exists. The banner
  // calls this on accept; previously CookieBanner.jsx referenced
  // window.__channeladLoadAhrefs but nothing ever defined it, so the script
  // loaded unconditionally and rejecting cookies did nothing.
  window.__channeladLoadAhrefs = function () {
    if (window.__channeladAhrefsLoaded) return;
    window.__channeladAhrefsLoaded = true;
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://analytics.ahrefs.com/analytics.js';
    s.dataset.key = 'fL5smjCwVE5/mjvICRXVVg';
    document.head.appendChild(s);
  };
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (window.__channeladConsent && window.__channeladConsent.analytics) {
        window.__channeladLoadAhrefs();
      }
    }, 2000);
  });
</script>
